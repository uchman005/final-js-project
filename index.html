<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=block" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="container">

    <header>
      <h1><span class="material-icons-round">task_alt</span> My Tasks</h1>
      <p class="date" id="today"></p>
    </header>

    <form class="card" id="task-form" novalidate>
      <h2 id="form-title">Add a task</h2>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required pattern=".{3,60}" maxlength="60" title="3–60 characters"
        placeholder="e.g. Submit project report">

      <label for="description">Description (optional)</label>
      <textarea id="description" name="description" rows="2" maxlength="200" placeholder="Add a few details"></textarea>

      <div class="row">
        <div>
          <label for="priority">Priority</label>
          <select id="priority" name="priority" required>
            <option value="">Select priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label for="due-date">Due date</label>
          <input type="date" id="due-date" name="dueDate" required>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-light" id="cancel-btn" hidden>Cancel</button>
        <button type="submit" class="btn" id="submit-btn">Add task</button>
      </div>
    </form>

    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" class="tab active" role="tab" id="tab-all">All (<span id="count-all">0</span>)</button>
      <button type="button" class="tab" role="tab" id="tab-pending">Pending (<span id="count-pending">0</span>)</button>
      <button type="button" class="tab" role="tab" id="tab-completed">Completed (<span
          id="count-completed">0</span>)</button>
      <button type="button" class="tab" role="tab" id="tab-overdue">Overdue (<span id="count-overdue">0</span>)</button>
    </nav>

    <ul class="task-list" id="task-list"></ul>
    <p class="empty" id="empty" hidden></p>

  </main>
  <script src="./index.js"></script>
</body>

</html>
